services:
  server:
    build:
      context: ./Server
    ports:
      - 50051:50051
    volumes:
      - ./control:/app/control:ro
    environment:
      SERVER_DELAY: ${SERVER_DELAY:-0}
      SERVER_HANG: ${SERVER_HANG:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50051), 1)"]
      interval: 2s
      retries: 10

  client1:
    build:
      context: ./Client1
    environment:
      GREETER_HOST: server
    depends_on:
      server:
        condition: service_healthy

  client2:
    build:
      context: ./Client2
      additional_contexts:
        proto: .   # greeter.proto location for COPY --from=proto
    environment:
      GREETER_HOST: server
    depends_on:
      server:
        condition: service_healthy
